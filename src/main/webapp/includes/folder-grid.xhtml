<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html>
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="jakarta.faces.html"
                xmlns:ui="jakarta.faces.facelets">

    <h:panelGroup rendered="#{not empty folders and folders.size() > 0}">
        <div class="grid-folders">
            <ui:repeat value="#{folders}" var="folder">
                <div class="card-folder"
                     onclick="window.location.href='folder-content.xhtml?folderId=#{folder.id}'">
                    <div class="card-folder-info">
                        <i class="fas fa-folder card-folder-icon"></i>
                        <span class="card-folder-name" title="#{folder.name}">#{folder.name}</span>
                    </div>
                    <h:form style="margin: 0; padding: 0;" onclick="event.stopPropagation();">
                        <h:commandLink action="#{folderBean.deleteFolder(folder)}" styleClass="card-action-btn"
                                       title="Delete folder"
                                       onclick="return confirm('Are you sure you want to delete this folder? All contents inside will be deleted.');">
                            <i class="fas fa-trash-alt"></i>
                        </h:commandLink>
                    </h:form>
                </div>
            </ui:repeat>
        </div>
    </h:panelGroup>

</ui:composition>
