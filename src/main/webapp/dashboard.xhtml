<ui:composition template="./template.xhtml"
                xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="jakarta.faces.html"
                xmlns:ui="jakarta.faces.facelets">

    <ui:define name="title">
        My Files - Cloud System
    </ui:define>

    <ui:define name="content">

        <h:messages globalOnly="true" styleClass="messages"/>

        <div class="page-header">
            <h2 class="page-title">My Files</h2>
        </div>

        <h:panelGroup rendered="#{folderBean.foldersList.size() > 0}">
            <h3 class="form-label"
                style="margin-bottom: 20px; font-size: 15px; color: var(--text-secondary);">Folders</h3>
            <ui:include src="/includes/folder-grid.xhtml">
                <ui:param name="folders" value="#{folderBean.foldersList}"/>
            </ui:include>
        </h:panelGroup>

        <h:panelGroup rendered="#{folderBean.foldersList.size() == 0}">
            <div class="empty-state">
                <i class="fas fa-cloud-upload-alt" style="font-size: 80px; color: #cbd5e1; margin-bottom: 24px;"></i>
                <h3>A safe place for all your files</h3>
                <p>Use the "New" button to create a folder and upload files.</p>
            </div>
        </h:panelGroup>

    </ui:define>

</ui:composition>
