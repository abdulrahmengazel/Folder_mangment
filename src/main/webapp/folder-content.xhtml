<ui:composition template="./template.xhtml"
                xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="jakarta.faces.html"
                xmlns:f="jakarta.faces.core"
                xmlns:ui="jakarta.faces.facelets">

    <f:metadata>
        <f:viewParam name="folderId" value="#{folderContentBean.folderId}"/>
        <f:viewAction action="#{folderContentBean.init}"/>
    </f:metadata>

    <ui:define name="title">
        <h:outputText
                value="#{not empty folderContentBean.currentFolder ? folderContentBean.currentFolder.name : 'Folder'}"/> - Cloud System
    </ui:define>

    <ui:define name="content">
        <h:messages globalOnly="true" styleClass="messages"/>

        <h:panelGroup rendered="#{not empty folderContentBean.currentFolder}">
            <div class="page-header" style="justify-content: flex-start; gap: 16px;">
                <h:link outcome="dashboard.xhtml"
                        style="color: var(--text-secondary); text-decoration: none; font-size: 20px; font-weight: 500; transition: color 0.2s;">
                    My Files
                </h:link>

                <!-- Simple Breadcrumb for parent folders -->
                <ui:fragment rendered="#{not empty folderContentBean.currentFolder.parentFolder}">
                     <i class="fas fa-chevron-right" style="color: #94a3b8; font-size: 14px;"/>
                     <h:link outcome="folder-content.xhtml" value="#{folderContentBean.currentFolder.parentFolder.name}"
                        style="color: var(--text-secondary); text-decoration: none; font-size: 18px; font-weight: 500; transition: color 0.2s;">
                         <f:param name="folderId" value="#{folderContentBean.currentFolder.parentFolder.id}"/>
                     </h:link>
                </ui:fragment>

                <i class="fas fa-chevron-right" style="color: #94a3b8; font-size: 14px;"/>
                <h2 class="page-title" style="font-weight: 600;"><h:outputText
                        value="#{folderContentBean.currentFolder.name}"/></h2>
            </div>

            <div style="display: flex; justify-content: flex-end; margin-bottom: 24px; gap: 10px;">
                <h:link outcome="new-folder.xhtml" styleClass="btn btn-outline" style="box-shadow: var(--shadow-sm);">
                    <f:param name="parentFolderId" value="#{folderContentBean.currentFolder.id}"/>
                    <i class="fas fa-folder-plus"/> New Subfolder
                </h:link>

                <h:link outcome="upload-file.xhtml" styleClass="btn btn-primary" style="box-shadow: var(--shadow-sm);">
                    <f:param name="targetFolderId" value="#{folderContentBean.currentFolder.id}"/>
                    <i class="fas fa-file-upload"/> Upload to this folder
                </h:link>
            </div>

            <!-- Subfolders Section -->
            <h:panelGroup rendered="#{folderContentBean.subFolders.size() > 0}">
                <h3 class="form-label" style="margin-bottom: 20px; font-size: 15px; color: var(--text-secondary);">Subfolders</h3>
                <div style="margin-bottom: 30px;">
                    <ui:include src="/includes/folder-grid.xhtml">
                        <ui:param name="folders" value="#{folderContentBean.subFolders}"/>
                    </ui:include>
                </div>
            </h:panelGroup>

            <!-- Files Section -->
            <h:panelGroup rendered="#{folderContentBean.filesInFolder.size() > 0}">
                <h3 class="form-label" style="margin-bottom: 20px; font-size: 15px; color: var(--text-secondary);">Files</h3>
                <div class="table-container">
                    <h:form id="folderFilesForm" style="margin: 0;">
                        <table class="data-table">
                            <thead>
                            <tr>
                                <th>Name</th>
                                <th style="width: 150px;">Size</th>
                                <th style="width: 150px;">Type</th>
                                <th style="width: 120px; text-align: center;">Star</th>
                                <th style="width: 120px; text-align: center;">Delete</th>
                            </tr>
                            </thead>
                            <tbody>
                            <ui:repeat value="#{folderContentBean.filesInFolder}" var="file">
                                <tr>
                                    <td>
                                        <div class="file-name-cell">
                                            <i class="fas fa-file-alt file-icon"/>
                                            <span><h:outputText value="#{file.name}"/></span>
                                        </div>
                                    </td>
                                    <td>
                                        <h:outputText value="#{file.size / 1024}">
                                            <f:convertNumber maxFractionDigits="2"/>
                                        </h:outputText> KB
                                    </td>
                                    <td style="color: var(--text-secondary);"><h:outputText value="#{file.type}"/></td>
                                    <td style="text-align: center;">
                                        <h:commandLink action="#{folderContentBean.toggleStar(file)}"
                                                       styleClass="table-action-btn"
                                                       title="#{file.starred ? 'Remove star' : 'Add star'}"
                                                       style="margin-right: 10px;">
                                            <i class="fas fa-star"
                                               style="color: #{file.starred ? '#f59e0b' : 'var(--text-secondary)'};"/>
                                        </h:commandLink>
                                    </td>
                                    <td style="text-align: center;">
                                        <h:commandLink action="#{folderContentBean.deleteFile(file)}"
                                                       styleClass="table-action-btn" title="Delete file"
                                                       onclick="return confirm('Are you sure you want to delete this file?');">
                                            <i class="fas fa-trash-alt"/>
                                        </h:commandLink>
                                    </td>
                                </tr>
                            </ui:repeat>
                            </tbody>
                        </table>
                    </h:form>
                </div>
            </h:panelGroup>
        </h:panelGroup>

        <h:panelGroup rendered="#{empty folderContentBean.currentFolder}">
            <div class="empty-state">
                <i class="fas fa-exclamation-triangle" style="font-size: 80px; color: #cbd5e1; margin-bottom: 24px;"/>
                <h3>Folder not accessible</h3>
                <p>The folder may have been deleted or you may no longer have permission to access it.</p>
            </div>
        </h:panelGroup>

        <h:panelGroup
                rendered="#{not empty folderContentBean.currentFolder and folderContentBean.filesInFolder.size() == 0 and folderContentBean.subFolders.size() == 0}">
            <div class="empty-state">
                <i class="fas fa-folder-open" style="font-size: 80px; color: #cbd5e1; margin-bottom: 24px;"/>
                <h3>This folder is empty</h3>
                <p>Use the buttons above to add content to this folder.</p>
            </div>
        </h:panelGroup>

    </ui:define>

</ui:composition>
