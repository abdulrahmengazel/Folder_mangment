<ui:composition template="./auth-template.xhtml"
                xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="jakarta.faces.html"
                xmlns:a="http://xmlns.jcp.org/jsf/passthrough"
                xmlns:ui="jakarta.faces.facelets">

    <ui:define name="title">Login - Cloud System</ui:define>

    <ui:define name="content">
        <div class="auth-header">
            <div class="auth-logo"
                 style="margin-left: auto; margin-right: auto; border-radius: 18px; display: flex; align-items: center; justify-content: center; background: linear-gradient(135deg, var(--primary-color), #7c3aed); color: white; box-shadow: 0 12px 24px rgba(37, 99, 235, 0.22);">
                <i class="fas fa-cloud" style="font-size: 22px;"></i>
            </div>
            <h1 class="auth-title">Log in</h1>
            <p class="auth-subtitle">Log in to continue to Cloud System</p>
        </div>

        <div class="auth-form">
            <h:form id="loginForm">
                <h:messages globalOnly="true" styleClass="messages"/>

                <div class="form-group">
                    <label class="form-label">Email or phone</label>
                    <h:inputText id="email" value="#{loginBean.user.email}" required="true"
                                 requiredMessage="Please enter an email" styleClass="form-control"
                                 a:placeholder="example@site.com"/>
                </div>

                <div class="form-group">
                    <label class="form-label">Password</label>
                    <h:inputSecret id="password" value="#{loginBean.user.password}" required="true"
                                   requiredMessage="Please enter your password" styleClass="form-control"
                                   a:placeholder="Enter your password"/>
                </div>

                <div class="auth-actions">
                    <h:link value="Create account" outcome="register.xhtml" styleClass="auth-link"/>
                    <h:commandButton value="Log in" action="#{loginBean.login()}" styleClass="btn btn-primary"
                                     style="padding: 12px 24px; font-size: 15px; border-radius: 12px;"/>
                </div>
            </h:form>
        </div>
    </ui:define>
</ui:composition>
